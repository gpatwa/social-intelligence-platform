openapi: 3.1.0
info:
  title: Social Intelligence Decision API
  version: 1.0.0
  description: Read governed opportunities and submit recommendation proposals.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder replaced by deployment configuration
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ready}
  /opportunities:
    get:
      operationId: listOpportunities
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema: {type: string}
        - in: query
          name: status
          schema: {type: string}
      responses:
        "200":
          description: Governed opportunity page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../json-schema/opportunity-v1.json
  /opportunities/{opportunity_id}:
    get:
      operationId: getOpportunity
      parameters:
        - in: path
          name: opportunity_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Opportunity with evidence lineage
          content:
            application/json:
              schema:
                $ref: ../json-schema/opportunity-v1.json
        "404": {description: Opportunity not found}
  /recommendations:
    post:
      operationId: proposeRecommendation
      description: Creates a PROPOSED recommendation. Approval is a separate human gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/recommendation-v1.json
      responses:
        "201":
          description: Proposal accepted
          content:
            application/json:
              schema:
                $ref: ../json-schema/recommendation-v1.json
        "409": {description: Idempotency conflict}
  /agent-stack/recommendations:
    post:
      operationId: recommendAgentStack
      description: Returns an evidence-linked, non-mutating AI automation stack recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/agent-stack-request-v1.json
      responses:
        "200":
          description: Deterministic implementation recommendation
          content:
            application/json:
              schema:
                $ref: ../json-schema/agent-stack-recommendation-v1.json
        "400": {description: Invalid workflow constraints}
  /evidence/ranked:
    post:
      operationId: rankEvidence
      description: Ranks decision-specific evidence from normalized features without fetching or mutating source data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/ranked-evidence-request-v1.json
      responses:
        "200":
          description: Explainable evidence ranking snapshot
          content:
            application/json:
              schema:
                $ref: ../json-schema/ranked-evidence-v1.json
        "400": {description: Invalid evidence candidates}
  /internal-pilots/plan:
    post:
      operationId: createInternalPilotPlan
      description: Creates a non-mutating, draft-only seven-day internal staging plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/internal-pilot-request-v1.json
      responses:
        "200":
          description: Internal staging pilot plan
          content:
            application/json:
              schema:
                $ref: ../json-schema/internal-pilot-plan-v1.json
        "400": {description: Invalid discovery inputs}
  /recommendation-contexts/compile:
    post:
      operationId: compileRecommendationContext
      description: Compiles a bounded, non-mutating context packet for a future batch reranker. It does not call a model or approve an action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/recommendation-context-request-v1.json
      responses:
        "200":
          description: Deterministic staging context ready for review or offline reranking
          content:
            application/json:
              schema:
                $ref: ../json-schema/recommendation-context-v1.json
        "400": {description: Invalid context inputs or no eligible candidates}
  /recommendation-reranks:
    post:
      operationId: rerankRecommendationContext
      description: Runs an offline, constrained rerank of an existing recommendation context. The output is draft-only and cannot activate an external action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/recommendation-context-v1.json
      responses:
        "200":
          description: Cited proposed ranking
          content:
            application/json:
              schema:
                $ref: ../json-schema/batch-rerank-v1.json
        "400": {description: Invalid context or ungrounded reranker output}
  /recommendation-reviews:
    post:
      operationId: createRecommendationReview
      description: Compiles an append-safe human approval, edit, or rejection over a cited offline rerank. It never launches a campaign or other external action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/recommendation-review-request-v1.json
      responses:
        "200":
          description: Human review artifact ready for governed control-plane persistence
          content:
            application/json:
              schema:
                $ref: ../json-schema/recommendation-review-v1.json
        "400": {description: Invalid review, tenant boundary, or candidate selection}
  /recommendation-outcomes:
    post:
      operationId: recordRecommendationOutcome
      description: Compiles an observational outcome for a human-approved or human-edited review. This endpoint does not claim causality or mutate an execution system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/recommendation-outcome-request-v1.json
      responses:
        "200":
          description: Outcome artifact ready for governed control-plane persistence
          content:
            application/json:
              schema:
                $ref: ../json-schema/recommendation-outcome-v1.json
        "400": {description: Invalid outcome or review is not approved}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
