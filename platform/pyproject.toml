[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-intelligence-mvp"
version = "0.1.1"
description = "Databricks social intelligence analytics MVP"
requires-python = ">=3.10"

[project.optional-dependencies]
standards = [
  "jsonschema>=4.23,<5.0",
  "PyYAML>=6.0,<7.0",
]
mcp = ["mcp>=2.0,<3.0"]
databricks = ["databricks-sql-connector>=3.0,<4.0"]
snowflake = ["snowflake-connector-python>=3.12,<4.0"]

[project.scripts]
social-intelligence-mcp = "social_intelligence.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
