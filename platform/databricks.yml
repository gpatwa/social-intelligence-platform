bundle:
  name: social-intelligence-mvp

include:
  - resources/*.yml

artifacts:
  connector_wheel:
    type: whl
    path: .
    build: python3 -m pip wheel . --no-deps -w dist
    files:
      - source: ./dist/*.whl

variables:
  catalog:
    description: Unity Catalog catalog used by the MVP
    default: main
  schema:
    description: Unity Catalog schema used by the MVP
    default: social_intelligence_${bundle.target}
  lookback_hours:
    description: Number of demo hours generated
    default: 72
  tenant_id:
    description: Tenant partition used by the demo source and serving tables
    default: demo
  youtube_source_id:
    description: Control-plane identifier for the YouTube connector
    default: youtube-api-v3
  youtube_secret_scope:
    description: Databricks secret scope containing the YouTube API key
    default: social-intelligence
  youtube_secret_key:
    description: Secret key containing the YouTube Data API v3 credential
    default: youtube-api-key
  youtube_search_expression:
    description: YouTube keyword expression; use pipe characters for OR terms
    default: Acme|GlowUpChallenge
  youtube_channel_ids:
    description: Optional comma-separated YouTube channel IDs
    default: ""
  youtube_region_code:
    description: ISO 3166-1 alpha-2 discovery region
    default: US
  youtube_relevance_language:
    description: YouTube relevance language
    default: en
  youtube_collect_comments:
    description: Whether the pilot collects top-level comment threads
    default: "false"
  youtube_collect_replies:
    description: Whether the pilot follows comment threads for replies
    default: "false"
  x_source_id:
    description: Control-plane identifier for the X recent-search connector
    default: x-api-v2
  x_search_expression:
    description: X Search Posts query expression; leave empty when using only hashtag or account rules
    default: ""
  x_hashtags:
    description: Optional comma-separated X hashtags, without requiring a leading hash
    default: ""
  x_account_handles:
    description: Optional comma-separated X account handles, with or without leading at signs
    default: ""
  x_trends_woeid:
    description: X Trends by WOEID market identifier
    default: "2487956"
  x_trends_location:
    description: Human-readable market name for the configured X trends WOEID
    default: San Francisco
  x_max_trends_per_run:
    description: Maximum X trends persisted from the configured market per run
    default: "20"
  instagram_source_id:
    description: Control-plane identifier for the Page-linked Instagram Graph API connector
    default: instagram-graph-api
  instagram_hashtags:
    description: Optional comma-separated Instagram hashtags for permitted recent-media discovery
    default: ""

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    mode: development
    default: true
    variables:
      # Databricks Free Edition creates this writable catalog by default.
      catalog: dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_VIEW
        group_name: users
