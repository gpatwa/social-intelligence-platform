resources:
  jobs:
    social_intelligence_external_ingestion:
      name: social-intelligence-external-ingestion-${bundle.target}
      description: Ingests externally collected social events and refreshes governed analytics.
      max_concurrent_runs: 1
      tasks:
        - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/00_initialize_platform.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}

        - task_key: configure_youtube_source
          depends_on:
            - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/05_configure_youtube_source.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
              source_id: ${var.youtube_source_id}
              secret_scope: external-github-actions
              secret_key: youtube-api-key
              search_expression: ${var.youtube_search_expression}
              channel_ids: ${var.youtube_channel_ids}
              poll_interval_seconds: "3600"
              owner: data-platform

        - task_key: ingest_connector_metrics
          depends_on:
            - task_key: configure_youtube_source
          notebook_task:
            notebook_path: ../notebooks/07_ingest_connector_metrics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: refresh_analytics
          depends_on:
            - task_key: ingest_connector_metrics
          notebook_task:
            notebook_path: ../notebooks/02_build_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: validate_external_ingestion
          depends_on:
            - task_key: refresh_analytics
          notebook_task:
            notebook_path: ../notebooks/08_validate_external_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
              source_id: ${var.youtube_source_id}

      schedule:
        quartz_cron_expression: 0 47 * * * ?
        timezone_id: America/Los_Angeles
        pause_status: PAUSED

      tags:
        product: social-intelligence
        runtime: external-collector
        environment: ${bundle.target}
