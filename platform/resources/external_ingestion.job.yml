resources:
  jobs:
    social_intelligence_external_ingestion:
      name: social-intelligence-external-ingestion-${bundle.target}
      description: Ingests externally collected social events and refreshes governed analytics.
      max_concurrent_runs: 1
      environments:
        - environment_key: snowflake_publisher
          spec:
            environment_version: "2"
            dependencies:
              - "snowflake-connector-python[pandas]>=3.12,<5"
      tasks:
        - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/00_initialize_platform.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}

        - task_key: configure_youtube_source
          depends_on:
            - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/05_configure_youtube_source.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
              source_id: ${var.youtube_source_id}
              secret_scope: external-github-actions
              secret_key: youtube-api-key
              search_expression: ${var.youtube_search_expression}
              channel_ids: ${var.youtube_channel_ids}
              poll_interval_seconds: "3600"
              owner: data-platform

        - task_key: ingest_connector_metrics
          depends_on:
            - task_key: configure_youtube_source
          notebook_task:
            notebook_path: ../notebooks/07_ingest_connector_metrics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: refresh_analytics
          depends_on:
            - task_key: ingest_connector_metrics
          notebook_task:
            notebook_path: ../notebooks/02_build_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_ranked_evidence
          depends_on:
            - task_key: refresh_analytics
          notebook_task:
            notebook_path: ../notebooks/13_build_ranked_evidence.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_decision_workflow
          depends_on:
            - task_key: build_ranked_evidence
          notebook_task:
            notebook_path: ../notebooks/12_build_decision_workflow.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_recommendation_review_scorecard
          depends_on:
            - task_key: build_decision_workflow
          notebook_task:
            notebook_path: ../notebooks/14_build_recommendation_review_scorecard.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: validate_external_ingestion
          depends_on:
            - task_key: build_recommendation_review_scorecard
          notebook_task:
            notebook_path: ../notebooks/08_validate_external_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
              source_id: ${var.youtube_source_id}

        - task_key: should_publish_snowflake
          depends_on:
            - task_key: validate_external_ingestion
          condition_task:
            op: EQUAL_TO
            left: ${var.snowflake_publish_enabled}
            right: "true"

        - task_key: publish_snowflake
          depends_on:
            - task_key: should_publish_snowflake
              outcome: "true"
          notebook_task:
            notebook_path: ../notebooks/11_publish_snowflake.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              snowflake_account: ${var.snowflake_account}
              snowflake_user: ${var.snowflake_user}
              snowflake_database: ${var.snowflake_database}
              snowflake_raw_schema: ${var.snowflake_raw_schema}
              snowflake_analytics_schema: ${var.snowflake_analytics_schema}
              snowflake_warehouse: ${var.snowflake_warehouse}
              snowflake_role: ${var.snowflake_role}
              secret_scope: ${var.snowflake_secret_scope}
              private_key_secret_key: ${var.snowflake_private_key_secret_key}
          environment_key: snowflake_publisher

      schedule:
        quartz_cron_expression: 0 47 * * * ?
        timezone_id: America/Los_Angeles
        pause_status: UNPAUSED

      tags:
        product: social-intelligence
        runtime: external-collector
        environment: ${bundle.target}
