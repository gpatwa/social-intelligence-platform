resources:
  jobs:
    social_intelligence_instagram_source_setup:
      name: social-intelligence-instagram-source-setup-${bundle.target}
      description: Registers governed Page-linked Instagram Graph API source intent for the external collector.
      max_concurrent_runs: 1
      tasks:
        - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/00_initialize_platform.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
        - task_key: configure_instagram_source
          depends_on:
            - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/10_configure_instagram_source.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
              source_id: ${var.instagram_source_id}
              secret_scope: external-github-actions
              secret_key: instagram-access-token
              hashtags: ${var.instagram_hashtags}
              poll_interval_seconds: "3600"
              owner: data-platform
      tags:
        product: social-intelligence
        connector: instagram
        environment: ${bundle.target}
