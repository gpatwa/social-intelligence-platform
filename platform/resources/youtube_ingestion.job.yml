resources:
  jobs:
    social_intelligence_youtube_ingestion:
      name: social-intelligence-youtube-ingestion-${bundle.target}
      description: Collects quota-bounded public YouTube data into the shared event envelope.
      max_concurrent_runs: 1
      tasks:
        - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/00_initialize_platform.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}

        - task_key: configure_youtube_source
          depends_on:
            - task_key: initialize_platform
          notebook_task:
            notebook_path: ../notebooks/05_configure_youtube_source.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
              source_id: ${var.youtube_source_id}
              secret_scope: ${var.youtube_secret_scope}
              secret_key: ${var.youtube_secret_key}
              search_expression: ${var.youtube_search_expression}
              channel_ids: ${var.youtube_channel_ids}
              poll_interval_seconds: "3600"
              owner: data-platform

        - task_key: ingest_youtube
          depends_on:
            - task_key: configure_youtube_source
          environment_key: connector
          notebook_task:
            notebook_path: ../notebooks/06_ingest_youtube.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tenant_id: ${var.tenant_id}
              source_id: ${var.youtube_source_id}
              secret_scope: ${var.youtube_secret_scope}
              secret_key: ${var.youtube_secret_key}
              region_code: ${var.youtube_region_code}
              relevance_language: ${var.youtube_relevance_language}
              lookback_hours: "6"
              max_search_pages_per_rule: "1"
              collect_comments: ${var.youtube_collect_comments}
              collect_replies: ${var.youtube_collect_replies}
        - task_key: refresh_analytics
          depends_on:
            - task_key: ingest_youtube
          notebook_task:
            notebook_path: ../notebooks/02_build_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_ranked_evidence
          depends_on:
            - task_key: refresh_analytics
          notebook_task:
            notebook_path: ../notebooks/13_build_ranked_evidence.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_decision_workflow
          depends_on:
            - task_key: build_ranked_evidence
          notebook_task:
            notebook_path: ../notebooks/12_build_decision_workflow.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_recommendation_review_scorecard
          depends_on:
            - task_key: build_decision_workflow
          notebook_task:
            notebook_path: ../notebooks/14_build_recommendation_review_scorecard.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

      environments:
        - environment_key: connector
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      schedule:
        quartz_cron_expression: 0 0 * * * ?
        timezone_id: America/Los_Angeles
        pause_status: PAUSED

      tags:
        product: social-intelligence
        platform: youtube
        environment: ${bundle.target}
