name: Site deploy (Cloudflare)

# Manual only. Deploying is an external state change, so it never runs on push.
# `dry_run` (the default) builds, tests and validates the Worker bundle with no
# credentials. Set it to false to deploy through the protected environment.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate only; do not touch Cloudflare
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `npm test` runs the build, then the rendered-HTML assertions.
      - run: npm test
      - name: Validate the Worker bundle offline
        run: npx wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/wrangler-out" --config deploy/cloudflare/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-production
    concurrency:
      group: site-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      PIPELINE_STATUS_INGEST_KEY: ${{ secrets.PIPELINE_STATUS_INGEST_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Require deploy configuration
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID PIPELINE_STATUS_INGEST_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not set in the cloudflare-production environment"
              missing=1
            fi
          done
          exit "${missing}"

      # Write the real D1 id into a git-ignored copy; the committed file keeps
      # its placeholder.
      - name: Render deploy config
        run: |
          sed "s/REPLACE_WITH_D1_DATABASE_ID/${CLOUDFLARE_D1_DATABASE_ID}/" \
            deploy/cloudflare/wrangler.jsonc > deploy/cloudflare/wrangler.rendered.jsonc
          if grep -q REPLACE_WITH_D1_DATABASE_ID deploy/cloudflare/wrangler.rendered.jsonc; then
            echo "::error::D1 placeholder was not replaced"
            exit 1
          fi

      # Migrations are additive and idempotent, and run before the new code so
      # the Worker never queries a table that does not exist yet.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config deploy/cloudflare/wrangler.rendered.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy --config deploy/cloudflare/wrangler.rendered.jsonc

      # Same key the collectors already send as a bearer token, so existing
      # collector runs keep working once PIPELINE_STATUS_URL points here.
      - name: Sync ingest key secret
        run: printf '%s' "${PIPELINE_STATUS_INGEST_KEY}" | npx wrangler secret put PIPELINE_STATUS_INGEST_KEY --config deploy/cloudflare/wrangler.rendered.jsonc

      - name: Smoke test
        if: ${{ env.SITE_URL != '' }}
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL}")"
          grep -q "Recent evidence, grouped by pilot topic" <<<"${body}" \
            || { echo "::error::expected hero text is missing"; exit 1; }
          for stale in "Discovery and serving are live" "Latest verified delivery" "dbc-b8672746"; do
            if grep -q "${stale}" <<<"${body}"; then
              echo "::error::stale content present: ${stale}"
              exit 1
            fi
          done
          curl -fsS "${SITE_URL%/}/api/pipeline-status" > /dev/null
