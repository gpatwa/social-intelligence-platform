name: Instagram collector

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: instagram-collector
  cancel-in-progress: false

jobs:
  collect:
    # A Page-linked Business account and a successful manual run are required
    # before this schedule is enabled.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_INSTAGRAM_COLLECTOR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install connector package
        run: python -m pip install ./platform
      - name: Preflight Meta Page and Instagram linkage
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_PAGE_ID: ${{ vars.INSTAGRAM_PAGE_ID }}
        run: |
          diagnostic="$(python -m social_intelligence.connectors.external_instagram --diagnose)"
          echo "${diagnostic}"
          python -c 'import json,sys; result=json.loads(sys.argv[1]); sys.exit(0 if result.get("status") == "READY" else 1)' "${diagnostic}" || {
            echo "Instagram is not ready. Link a Professional Instagram account to the configured Facebook Page before collecting."
            exit 1
          }
      - name: Collect and land Instagram media
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG || 'dev' }}
          DATABRICKS_SCHEMA: ${{ vars.DATABRICKS_SCHEMA || 'social_intelligence_dev' }}
          SOCIAL_TENANT_ID: ${{ vars.SOCIAL_TENANT_ID || 'demo' }}
          INSTAGRAM_SOURCE_ID: ${{ vars.INSTAGRAM_SOURCE_ID || 'instagram-graph-api' }}
          INSTAGRAM_PAGE_ID: ${{ vars.INSTAGRAM_PAGE_ID }}
          INSTAGRAM_HASHTAGS: ${{ vars.INSTAGRAM_HASHTAGS }}
          INSTAGRAM_LOOKBACK_HOURS: ${{ vars.INSTAGRAM_LOOKBACK_HOURS || '24' }}
          INSTAGRAM_MAX_MEDIA_PAGES_PER_RULE: ${{ vars.INSTAGRAM_MAX_MEDIA_PAGES_PER_RULE || '1' }}
          INSTAGRAM_MAX_REQUESTS_PER_RUN: ${{ vars.INSTAGRAM_MAX_REQUESTS_PER_RUN || '100' }}
        run: python -m social_intelligence.connectors.external_instagram
